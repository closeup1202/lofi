plugins {
    id 'org.springframework.boot'
}

configurations {
    otelAgent
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    otelAgent 'io.opentelemetry.javaagent:opentelemetry-javaagent:2.26.1'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:2.9.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

bootRun {
    jvmArgs "-javaagent:${configurations.otelAgent.asPath}"
    environment 'OTEL_EXPORTER_OTLP_ENDPOINT', 'http://localhost:4318'
    environment 'OTEL_EXPORTER_OTLP_PROTOCOL', 'http/protobuf'
    environment 'OTEL_RESOURCE_ATTRIBUTES', 'deployment.commit.hash=sample-commit-001'
    environment 'OTEL_TRACES_SAMPLER', 'always_on'
    environment 'OTEL_METRICS_EXPORTER', 'none'
    environment 'OTEL_LOGS_EXPORTER', 'none'
}
