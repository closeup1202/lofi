plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.12' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

allprojects {
    group = 'io.github.closeup1202'
    version = '0.3.0'
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.12"
        }
    }

    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).tap {
        configureEach {
            options.compilerArgs << '-parameters'
        }
    }

    tasks.withType(Javadoc).configureEach {
        def opts = options as StandardJavadocDocletOptions
        opts.encoding = 'UTF-8'
        opts.addStringOption('Xdoclint:none', '-quiet')
        if (JavaVersion.current().isJava9Compatible()) {
            opts.addBooleanOption('html5', true)
        }
        failOnError = false
    }
}

// Modules to publish to Maven Central
def publishableProjects = [
        project(':lofi-core'),
        project(':lofi-collector'),
        project(':lofi-actuator'),
        project(':lofi-spring-boot-starter')
]

configure(publishableProjects) {
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    java {
        withSourcesJar()
        withJavadocJar()
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                pom {
                    name = project.name
                    description = 'Lofi — Lightweight method-level performance monitoring for Spring Boot'
                    url = 'https://github.com/closeup1202/lofi'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                    developers {
                        developer {
                            id = 'closeup1202'
                            name = 'closeup1202'
                            url = 'https://github.com/closeup1202'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/closeup1202/lofi.git'
                        developerConnection = 'scm:git:ssh://github.com/closeup1202/lofi.git'
                        url = 'https://github.com/closeup1202/lofi'
                    }
                }
            }
        }
    }

    signing {
        useGpgCmd()
        sign publishing.publications.mavenJava
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri('https://ossrh-staging-api.central.sonatype.com/service/local/'))
            snapshotRepositoryUrl.set(uri('https://ossrh-staging-api.central.sonatype.com/content/repositories/snapshots/'))
            username.set(findProperty('OSSRH_USERNAME')?.toString() ?: System.getenv('OSSRH_USERNAME') ?: '')
            password.set(findProperty('OSSRH_PASSWORD')?.toString() ?: System.getenv('OSSRH_PASSWORD') ?: '')
        }
    }
}
