name: Release lofi-otelcol binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload binaries to (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-otelcol:
    name: Build lofi-otelcol (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: lofi-otel-exporter/go.sum

      - name: Install OCB
        run: go install go.opentelemetry.io/collector/cmd/builder@v0.123.0

      - name: Build lofi-otelcol
        working-directory: lofi-otel-exporter
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          builder --config ocb-config.yaml --skip-strict-versioning
          mv dist/lofi-otelcol dist/lofi-otelcol-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: lofi-otel-exporter/dist/lofi-otelcol-${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
