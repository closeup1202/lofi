name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-otelcol:
    name: Build lofi-otelcol (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: lofi-otel-exporter/go.sum

      - name: Install OCB
        run: go install go.opentelemetry.io/collector/cmd/builder@v0.123.0

      - name: Build lofi-otelcol
        working-directory: lofi-otel-exporter
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          builder --config ocb-config.yaml --skip-strict-versioning
          mv dist/lofi-otelcol dist/lofi-otelcol-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: lofi-otelcol-${{ matrix.goos }}-${{ matrix.goarch }}
          path: lofi-otel-exporter/dist/lofi-otelcol-${{ matrix.goos }}-${{ matrix.goarch }}

  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew build --no-daemon

      - name: Upload JARs
        uses: actions/upload-artifact@v5
        with:
          name: release-jars
          path: |
            lofi-core/build/libs/*.jar
            lofi-collector/build/libs/*.jar
            lofi-actuator/build/libs/*.jar
            lofi-spring-boot-starter/build/libs/*.jar

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        run: |
          ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository --no-daemon \
            -Psigning.gnupg.keyName=${{ secrets.GPG_KEY_ID }} \
            -Psigning.gnupg.passphrase=${{ secrets.GPG_PASSPHRASE }}
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish, build-otelcol]

    steps:
      - uses: actions/checkout@v5

      - name: Download JARs
        uses: actions/download-artifact@v5
        with:
          name: release-jars
          path: release-jars

      - name: Download lofi-otelcol binaries
        uses: actions/download-artifact@v5
        with:
          pattern: lofi-otelcol-*
          path: otelcol-binaries
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-jars/**/*.jar
            otelcol-binaries/lofi-otelcol-*
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
