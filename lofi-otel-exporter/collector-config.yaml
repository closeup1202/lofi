# Sample OpenTelemetry Collector configuration using the lofi exporter.
# Pass this file to your collector binary:
#   ./dist/lofi-otelcol --config collector-config.yaml

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  lofi:
    backend_url: http://localhost:9292
    api_key: ${env:LOFI_API_KEY}
    # Optional — drop spans by parsed className before ingestion.
    # Mirrors the Actuator-mode `lofi.exclude-packages` property:
    #   - "pkg.*" matches pkg and its sub-packages (respects boundaries)
    #   - "pkg"   is a legacy startsWith match
    #   - "*"     drops everything (useful for smoke tests only)
    # exclude_packages:
    #   - com.acme.api.controller.admin.*
    #   - com.acme.adaptor.ops.*

service:
  telemetry:
    logs:
      level: debug
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [lofi]
