receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  lofi:
    backend_url: http://lofi-backend:9292

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [lofi]
