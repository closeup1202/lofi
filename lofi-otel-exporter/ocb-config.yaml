# OpenTelemetry Collector Builder configuration
# Build a minimal collector binary that includes the lofi exporter.
#
# Prerequisites:
#   go install go.opentelemetry.io/collector/cmd/builder@latest
#
# Usage:
#   builder --config ocb-config.yaml

dist:
  name: lofi-otelcol
  description: OpenTelemetry Collector with lofi exporter
  output_path: ./dist

exporters:
  - gomod: github.com/closeup1202/lofi/lofiexporter v0.1.0
    path: ./

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.123.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.123.0

extensions:
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.123.0
